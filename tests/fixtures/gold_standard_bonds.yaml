# =============================================================================
# RECIPROCITY - Golden Rule variants
# =============================================================================

- id: gold_confucian_reciprocity
  text: "Tzu-kung asked: 'Is there a single word which can be a guide to conduct throughout one's life?' The Master said: 'It is perhaps the word shu. Do not impose on others what you yourself do not desire.'"
  language: classical_chinese
  tradition: confucian
  source: Analects 15:24
  expected_bonds:
    - bond_type: prohibition
      agent_role: agent
      patient_role: patient
      action: harm
      modal_strength: must_not
      context: generic
      condition: "what you yourself do not desire"
      confidence: 0.9

- id: gold_biblical_golden_rule
  text: "So whatever you wish that others would do to you, do also to them, for this is the Law and the Prophets."
  language: hebrew
  tradition: biblical
  source: Matthew 7:12
  expected_bonds:
    - bond_type: obligation
      agent_role: agent
      patient_role: patient
      action: help
      modal_strength: should
      context: generic
      condition: "what you wish others would do"
      confidence: 0.85

# =============================================================================
# MODERN EXAMPLES - Dear Abby style
# =============================================================================

- id: gold_modern_debt
  text: "My friend borrowed $500 from me six months ago and hasn't paid it back. She says she forgot. Am I wrong to ask for it?"
  language: english
  tradition: modern_american
  source: Dear Abby
  expected_bonds:
    - bond_type: obligation
      agent_role: debtor
      patient_role: creditor
      action: repay
      modal_strength: must
      context: economic
      confidence: 0.9
    - bond_type: claim
      agent_role: creditor
      patient_role: debtor
      action: receive
      modal_strength: may
      context: economic
      confidence: 0.85

- id: gold_modern_secret
  text: "My sister told me she's having an affair. I feel obligated to tell her husband, but she made me promise not to. What should I do?"
  language: english
  tradition: modern_american
  source: Dear Abby
  expected_bonds:
    - bond_type: obligation
      agent_role: promiser
      patient_role: promisee
      action: keep_secret
      modal_strength: should
      context: family
      confidence: 0.8
    - bond_type: obligation
      agent_role: agent
      patient_role: patient
      action: tell_truth
      modal_strength: should
      context: family
      condition: "competing obligation"
      confidence: 0.75

- id: gold_modern_elderly_care
  text: "My elderly mother expects me to call her every day and visit every weekend. I have my own family and job. Am I obligated to meet all her demands?"
  language: english
  tradition: modern_american
  source: Dear Abby
  expected_bonds:
    - bond_type: obligation
      agent_role: child
      patient_role: parent
      action: help
      modal_strength: should
      context: family
      exception: "within reasonable limits"
      confidence: 0.85

