# Gold Standard Moral Bond Annotations
# Manual annotations for validating extraction quality
# Each entry has: passage text, metadata, and expected bond extractions

# =============================================================================
# FILIAL PIETY - Cross-cultural universal
# =============================================================================

- id: gold_biblical_honor_parents
  text: "Honor your father and your mother, that your days may be long in the land that the LORD your God is giving you."
  language: hebrew
  tradition: biblical
  source: Exodus 20:12
  expected_bonds:
    - bond_type: obligation
      agent_role: child
      patient_role: parent
      action: honor
      modal_strength: must
      context: family
      confidence: 1.0

- id: gold_confucian_filial_piety
  text: "The Master said: In serving your parents, you may gently remonstrate. If you see that they are not inclined to follow your advice, remain reverent and do not oppose them; work hard and do not murmur."
  language: classical_chinese
  tradition: confucian
  source: Analerta 4:18
  expected_bonds:
    - bond_type: obligation
      agent_role: child
      patient_role: parent
      action: obey
      modal_strength: should
      context: family
      condition: "may gently remonstrate first"
      confidence: 0.95
    - bond_type: prohibition
      agent_role: child
      patient_role: parent
      action: refrain
      modal_strength: must_not
      context: family
      condition: "do not oppose them"
      confidence: 0.9

- id: gold_dharma_son_duty
  text: "The son should serve his parents as the eastern direction: by rising to greet them, by serving them, by obeying them, by providing for their needs, and by honoring their traditions."
  language: sanskrit
  tradition: dharma
  source: Sigalovada Sutta
  expected_bonds:
    - bond_type: obligation
      agent_role: child
      patient_role: parent
      action: honor
      modal_strength: should
      context: family
      confidence: 0.95

- id: gold_quranic_parents
  text: "And your Lord has decreed that you worship none but Him, and that you be dutiful to your parents. If one or both of them attain old age in your care, never say to them 'uff' nor repel them, but address them with words of honor."
  language: arabic
  tradition: quranic
  source: Quran 17:23-24
  expected_bonds:
    - bond_type: obligation
      agent_role: child
      patient_role: parent
      action: honor
      modal_strength: must
      context: family
      confidence: 1.0
    - bond_type: prohibition
      agent_role: child
      patient_role: parent
      action: harm
      modal_strength: must_not
      context: family
      condition: "never say 'uff'"
      confidence: 0.9

