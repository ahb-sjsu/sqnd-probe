  language: classical_chinese
  tradition: confucian
  source: Analects 2:22
  expected_bonds:
    - bond_type: obligation
      agent_role: agent
      patient_role: community
      action: tell_truth
      modal_strength: must
      context: generic
      confidence: 0.85

